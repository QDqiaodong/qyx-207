version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: railway-rest-bench-mysql
    ports:
      - "127.0.0.1:3353:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-railway2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-railway_db}
      TZ: Asia/Shanghai
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/sql:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - railway-network

  redis:
    image: redis:7
    container_name: railway-rest-bench-redis
    ports:
      - "127.0.0.1:6426:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-railway_redis}
      TZ: Asia/Shanghai
    command: redis-server --requirepass ${REDIS_PASSWORD:-railway_redis}
    volumes:
      - ./data/redis:/data
    restart: always
    networks:
      - railway-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railway-rest-bench-backend
    ports:
      - "127.0.0.1:8137:8137"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-railway_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-railway2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-railway_redis}
      TZ: Asia/Shanghai
    depends_on:
      - mysql
      - redis
    restart: always
    networks:
      - railway-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railway-rest-bench-frontend
    ports:
      - "127.0.0.1:8127:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
    restart: always
    networks:
      - railway-network

networks:
  railway-network:
    driver: bridge
