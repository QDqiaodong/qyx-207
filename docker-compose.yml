services:
  mysql:
    image: ${DOCKER_REGISTRY:-}mysql:8.0
    container_name: ${APP_NAME}-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3353}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-railway2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-railway_db}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/sql:/docker-entrypoint-initdb.d
    restart: always
    networks:
      - railway-network

  redis:
    image: ${DOCKER_REGISTRY:-}redis:7
    container_name: ${APP_NAME}-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6426}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-railway_redis}
      TZ: Asia/Shanghai
    command: redis-server --requirepass ${REDIS_PASSWORD:-railway_redis}
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - railway-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8137}:8137"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-railway_db}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-railway2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-railway_redis}
      TZ: Asia/Shanghai
    depends_on:
      - mysql
      - redis
    restart: always
    networks:
      - railway-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8127}:80"
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - backend
    restart: always
    networks:
      - railway-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  railway-network:
    driver: bridge
